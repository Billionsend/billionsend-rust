[package]
name = "billionsend"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Rust SDK for the BillionSend email API"
license = "MIT"
repository = "https://github.com/billionsend/billionsend-rust"
homepage = "https://billionsend.com/docs/sdks/rust"
documentation = "https://docs.rs/billionsend"
readme = "README.md"
keywords = ["billionsend", "email", "api", "sdk", "inbox"]
categories = ["api-bindings", "email", "web-programming::http-client"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["rustls"]
## TLS through rustls (the default).
rustls = ["reqwest/rustls"]
## TLS through the platform's native library instead.
native-tls = ["reqwest/native-tls"]

[dependencies]
base64 = "0.22"
bytes = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
httpdate = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream", "query", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http = "1"
jsonschema = { version = "0.61", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[workspace]
members = ["xtask"]
